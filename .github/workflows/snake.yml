name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Uses the custom PAT to fetch private/org data
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VeduStorm
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: dist/snake.svg?palette=github-dark

      # Pushes the generated SVG back to the repo using the default token
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
